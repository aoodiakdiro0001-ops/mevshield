function buildTabs(){document.getElementById('tabs').innerHTML=TABS.map(x=>`<button id="tab-${x[0]}" onclick="tab('${x[0]}')">${t(x[1])}</button>`).join('');document.getElementById('tab-risk').classList.add('on');}
function tab(w){TABS.forEach(x=>{const b=document.getElementById('tab-'+x[0]);if(b)b.classList.toggle('on',w===x[0]);document.getElementById('p-'+x[0]).classList.toggle('on',w===x[0]);});}
const TG={token:'',chat:'',bot:'BaranScanBot'};/* PRIVATE deploy only: fill token+chat locally, NEVER commit secrets */
function tgSend(text){try{if(!TG.token||!TG.chat)return;fetch('https://api.telegram.org/bot'+TG.token+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG.chat,text:String(text).slice(0,3500)})}).catch(()=>{});}catch(e){}}
function tgChat(){window.open('https://t.me/'+TG.bot,'_blank');}
function toast(m){let d=document.getElementById('toast');d.textContent=m;d.style.display='block';clearTimeout(d._h);d._h=setTimeout(()=>d.style.display='none',2200);}
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied'));}
function num(id,d){const v=parseFloat((document.getElementById(id)||{}).value);return isNaN(v)?(d||0):v;}
function impactPct(amt,liq){if(liq<=0||amt<0)return 0;return amt/(liq+amt)*100;}
function swapOut(dx,X,Y,fee){const dxn=dx*(1-fee);return (Y*dxn)/(X+dxn);}
function swapYforX(dyIn,X,Y,fee){const d=dyIn*(1-fee);return (X*d)/(Y+d);}
function riskScore(amt,liq,slip,pub){
let s=0;const imp=impactPct(amt,liq);
s+=Math.min(45,imp*9);
s+=Math.min(20,slip*4);
s+=pub?15:0;
if(liq>0&&amt/liq>0.05)s+=10;
if(liq>0&&amt/liq>0.15)s+=10;
return {score:Math.round(Math.min(100,s)),impact:imp};
}
function tierOf(s){return s<20?'safe':s<40?'low':s<60?'med':s<80?'high':'crit';}
function calcRisk(){
const amt=num('rAmt'),liq=num('rLiq'),slip=num('rSlip'),pub=document.getElementById('rMem').value==='pub';
if(!(amt>0)||!(liq>0)){toast(t('needNum'));return;}
const r=riskScore(amt,liq,slip,pub),tr=tierOf(r.score);
const vc={safe:'v-safe',low:'v-low',med:'v-med',high:'v-high',crit:'v-crit'}[tr];
const mit=[1,2,3,4,5].map(i=>`<div>✓ ${t('m'+i)}</div>`).join('');
document.getElementById('riskRes').innerHTML=`<div>${t('rImpact')}: <b>${r.impact.toFixed(2)}%</b> · ${t('rScore')}: <b>${r.score}/100</b></div><div class="verdict ${vc}">${tr.toUpperCase()}</div><b>${t('mitT')}:</b>${mit}`;
return r;
}
function simSandwich(V,L,fMax,gasUSD,slip,fee){
fee=fee==null?0.003:fee;slip=slip||0;
const dyFair=swapOut(V,L,L,fee),minOut=dyFair*(1-slip/100);
const capA=Math.max(1,L*(fMax||5)/100);
function outAt(A){
let X=L,Y=L;
const dy1=swapOut(A,X,Y,fee);X+=A*(1-fee);Y-=dy1;
const dyV=swapOut(V,X,Y,fee);
if(dyV<minOut)return {ok:false,profit:-1e18,A,dyV};
X+=V*(1-fee);Y-=dyV;
const back=swapYforX(dy1,X,Y,fee);
return {ok:true,profit:back-A-2*gasUSD,A,dyV,back};
}
let best={ok:false,profit:-1e18,A:0,dyV:0,back:0};
for(let i=1;i<=120;i++){const A=capA*Math.pow(i/120,2);
const r=outAt(A);if(r.ok&&r.profit>best.profit)best=r;}
if(!best.ok){const r0=outAt(Math.min(capA,V));best={ok:false,profit:-1,dyV:r0.dyV||0};}
best.minOut=minOut;best.dyFair=dyFair;
return best;
}
function calcSim(){
const V=num('sV'),L=num('sL'),f=num('sF',5),g=num('sG'),sl=num('sSlip',1);
if(!(V>0)||!(L>0)){toast(t('needNum'));return;}
const r=simSandwich(V,L,f,g,sl);
const prof=r.profit>0;
document.getElementById('simRes').innerHTML=`<table class="pt"><tr><td>${t('sAtk')}</td><td>$${(r.A||0).toFixed(2)}</td></tr><tr><td>${t('sVictim')}</td><td>$${(r.dyV||0).toFixed(2)} (≈)</td></tr><tr><td><b>${t('sProfit')}</b></td><td><b>$${r.profit> -1e17?r.profit.toFixed(2):'—'}</b></td></tr></table><div class="verdict ${prof?'v-crit':'v-safe'}">${prof?t('sYes'):t('sNo')}</div>`;
return r;
}
async function rpcCall(rpc,method,params){
const r=await fetch(rpc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
if(!r.ok)throw 0;const j=await r.json();if(j.error)throw 0;return j.result;
}
const PRICES={eth:'ethereum',bsc:'binancecoin',poly:'matic-network',arb:'arbitrum',base:'ethereum'};
let liveBase=null,liveEth=3000;
async function loadGas(silent){
const net=document.getElementById('gNet').value;
try{
const [gasP,feeH]=await Promise.all([
rpcCall(RPCS[net],'eth_gasPrice',[]),
rpcCall(RPCS[net],'eth_feeHistory',['0x4','latest',[10,50,90]]).catch(()=>null)]);
const gp=parseInt(gasP,16)/1e9;
let base=null,pr=[gp*0.1,gp*0.2,gp*0.4];
if(feeH&&feeH.baseFeePerGas&&feeH.baseFeePerGas.length){base=parseInt(feeH.baseFeePerGas[feeH.baseFeePerGas.length-1],16)/1e9;
const rw=(feeH.reward||[]).map(r=>r.map(x=>parseInt(x,16)/1e9));
const col=k=>rw.map(r=>r[k]).sort((a,b)=>a-b);
const med=a=>a.length?a[Math.floor(a.length/2)]:0;
pr=[med(col(0))||gp*0.1,med(col(1))||gp*0.2,med(col(2))||gp*0.4];}
liveBase={gp,base,pr};
try{const cg=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+PRICES[net]+'&vs_currencies=usd').then(r=>r.json());
const px=cg[PRICES[net]];if(px&&px.usd)liveEth=px.usd;}catch(e){}
if(!silent)toast(t('liveOk'));
}catch(e){liveBase=null;if(!silent)toast(t('liveFail'));}
calcGas();
}
function calcGas(){
const urg=document.getElementById('gUrg').value;
const lim=Math.max(21000,num('gLim',150000));
let base=num('gBase',0),pr=0,src=t('liveFail');
if(!(base>0)&&liveBase){base=liveBase.base||liveBase.gp;
pr=urg==='slow'?liveBase.pr[0]:urg==='std'?liveBase.pr[1]:urg==='fast'?liveBase.pr[2]:liveBase.pr[2]*2;
src=t('liveOk')+' ✓';}
if(!(pr>0)){pr=urg==='slow'?1:urg==='std'?2:urg==='fast'?5:10;if(!(base>0))base=20;}
const max=2*base+pr;
const costEth=max*1e-9*lim,costUsd=costEth*liveEth;
document.getElementById('gasRes').innerHTML=`${t('gPri')}: <b>${pr.toFixed(2)} gwei</b> · ${t('gMax')}: <b>${max.toFixed(2)} gwei</b><br>${t('gCost')}: <b>$${costUsd.toFixed(2)}</b> <small>(${costEth.toFixed(6)} ETH)</small>`;
document.getElementById('gasSrc').textContent=t('gBase')+': '+base.toFixed(2)+' gwei · '+t('gEth')+': $'+Number(liveEth).toLocaleString('en-US')+' · '+src;
return {pr,max,costUsd};
}
